<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextGen Weather</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <video id="video-bg" autoplay muted loop playsinline>
      <source src="videos/sunny.mp4" type="video/mp4" />
    </video>

    <div id="card-bg-dark"></div>
    <canvas id="card-center"></canvas>

    <!-- MAIN CONTAINER -->
    <div class="app-container">
      <div class="weather-card">
        <h1>Weather</h1>

        <div class="search-box">
          <input type="text" id="cityInput" placeholder="Search city..." />
          <button id="searchBtn">Search</button>
        </div>

        <img id="weatherIcon" />

        <h2 id="cityName">--</h2>
        <p id="country">--</p>
        <p id="temperature">-- °C</p>
        <p id="description">--</p>

        <div class="extra-info">
          <div>
            <span>Feels Like</span>
            <p id="feelsLike">-- °C</p>
          </div>
          <div>
            <span>Humidity</span>
            <p id="humidity">--%</p>
          </div>
          <div>
            <span>Wind</span>
            <p id="wind">-- km/h</p>
          </div>
        </div>
      </div>
    </div>
    <audio id="rainSound" loop></audio>
    <script src="script.js"></script>
  </body>
</html>
